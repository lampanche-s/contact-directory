spring:
  application:
    name: contact-directory-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contact_directory_db}
    username: ${DB_USERNAME:contact_directory}
    password: ${DB_PASSWORD:contact_directory}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

  servlet:
    session:
      timeout: 30m
      cookie:
        name: CONTACT_DIRECTORY_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:admin}
    password: ${INITIAL_ADMIN_PASSWORD:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

  storage:
    contact-photos-dir: ${CONTACT_PHOTOS_DIR:.uploads/contact-photos}

  upload:
    max-photo-size-bytes: 5242880
